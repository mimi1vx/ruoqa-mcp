[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "MIT-0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
# ruoqa-mcp itself is GPL-3.0-or-later, and so is its `ruoqa` dependency; the
# allow-list above stays permissive-only so a future dependency dragging in a
# GPL-incompatible term (an `OpenSSL` or CDDL clause) fails CI rather than
# quietly shipping.
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "ruoqa-mcp" },
    { allow = ["GPL-3.0-or-later"], crate = "ruoqa" },
]
