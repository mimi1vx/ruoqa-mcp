name: release

# release-plz creates the tag and GitHub Release with GITHUB_TOKEN, and GitHub
# suppresses workflow triggers for events raised by GITHUB_TOKEN. So neither
# `push: tags` nor `release: published` fires for an automated release — this
# workflow has to be *called* by release-plz.yml instead. The `push: tags`
# trigger is kept for hand-pushed tags; `workflow_dispatch` is the manual
# retry path.
on:
  workflow_call:
    inputs:
      ref:
        description: Tag to publish from.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish from, e.g. v0.1.2.
        required: true
        type: string
  push:
    tags: ['v*']

jobs:
  # Builds first, publishes to crates.io last: crates.io can never be
  # unpublished or amended, so it must not run until the release artifacts
  # exist and are attached to the GitHub Release.
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          TAG="${{ inputs.ref || github.ref_name }}"
          NAME="ruoqa-mcp-${TAG}-${{ matrix.target }}"
          mkdir "$NAME"
          strip target/release/ruoqa-mcp -o "$NAME/ruoqa-mcp"
          cp README.md COPYING "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruoqa-mcp-${{ matrix.target }}
          path: |
            ruoqa-mcp-*.tar.gz
            ruoqa-mcp-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.ref || github.ref_name }}"
          REPO="${{ github.repository }}"
          if out=$(gh release view "$TAG" --repo "$REPO" --json tagName 2>&1); then
            echo "::notice::Release $TAG already exists; reusing it."
          elif printf '%s' "$out" | grep -qi 'release not found'; then
            gh release create "$TAG" --repo "$REPO" --generate-notes --verify-tag
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber dist/*

  # Native builders only: an emulated `aws-lc-sys` compile under QEMU takes
  # tens of minutes, and `ubuntu-24.04-arm` runners make it unnecessary.
  container:
    needs: assets
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Prepare
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          TAG="${{ inputs.ref || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          outputs: type=image,name=ghcr.io/mimi1vx/ruoqa-mcp,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  container-manifest:
    needs: container
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          TAG="${{ inputs.ref || github.ref_name }}"
          VERSION="${TAG#v}"
          # shellcheck disable=SC2046 # word-splitting the digest list is intentional
          docker buildx imagetools create \
            -t "ghcr.io/mimi1vx/ruoqa-mcp:${VERSION}" \
            -t ghcr.io/mimi1vx/ruoqa-mcp:latest \
            $(printf 'ghcr.io/mimi1vx/ruoqa-mcp@sha256:%s ' *)
      - name: Inspect image
        run: |
          set -euo pipefail
          TAG="${{ inputs.ref || github.ref_name }}"
          docker buildx imagetools inspect "ghcr.io/mimi1vx/ruoqa-mcp:${TAG#v}"

  publish:
    needs: assets
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # OIDC exchange — required
      contents: read      # setting any permissions zeroes the rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on `push`, where checkout falls back to the pushed tag.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # A retry, a hand-pushed tag racing the automated call, or GitHub's
      # at-least-once push delivery can run this job twice for one version.
      # crates.io rejects the loser with "already uploaded"/"already exists";
      # treat that as a no-op instead of a failed run.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          output=$(cargo publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qE 'already (uploaded|exists)'; then
            echo "::notice::Version already published to crates.io; treating as no-op."
            exit 0
          fi
          exit $status
