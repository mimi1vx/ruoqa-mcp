[package]
name = "ruoqa-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server exposing curated, typed tools over the openQA REST API"
license = "GPL-3.0-or-later"

[[bin]]
name = "ruoqa-mcp"
path = "src/main.rs"

[lib]
name = "ruoqa_mcp"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "3.1", features = [
    "server", "macros", "schemars",
    "transport-io", "transport-streamable-http-server",
] }
ruoqa = "0.1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
reqwest = { version = "0.13", default-features = false }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util", "io-util"] }
rmcp = { version = "3.1", features = ["client"] }
